<div class="flex min-h-screen flex-col">
  <header class="flex h-14 items-center gap-2 border-b px-4">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="md:hidden"
      type="button"
      aria-label="Open menu"
      (click)="menuOpen.set(true)"
    >
      <ng-icon name="lucideMenu" appIconTone="brand" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="hidden md:inline-flex"
      type="button"
      aria-controls="sidebar"
      [attr.aria-label]="sidebarLabel()"
      [attr.aria-expanded]="sidebarOpen()"
      (click)="toggleSidebar()"
    >
      <ng-icon name="lucideMenu" appIconTone="brand" aria-hidden="true" />
    </button>
    <a routerLink="/" class="text-xl font-bold" title="Go to the Dashboard">Cargomar Pvt Ltd</a>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="ml-auto"
      type="button"
      [attr.aria-label]="themeLabel()"
      (click)="toggleTheme()"
    >
      <ng-icon [name]="themeIcon()" aria-hidden="true" />
    </button>
  </header>

  <div class="flex flex-1">
    <aside id="sidebar" class="w-56 flex-none border-r" [class]="sidebarOpen() ? 'hidden md:block' : 'hidden'">
      <app-nav />
    </aside>

    <main class="page w-full min-w-0 flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>

<hlm-sheet side="left" [state]="menuOpen() ? 'open' : 'closed'" (stateChanged)="menuOpen.set($event === 'open')">
  <hlm-sheet-content *hlmSheetPortal="let ctx">
    <hlm-sheet-header>
      <h3 hlmSheetTitle>Menu</h3>
    </hlm-sheet-header>
    <app-nav (navigated)="menuOpen.set(false)" />
  </hlm-sheet-content>
</hlm-sheet>
