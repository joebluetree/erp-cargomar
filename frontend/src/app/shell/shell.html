<!-- While a backend request runs the application is inert (no focus or keys) and the freeze layer catches clicks. -->
<div class="flex min-h-screen flex-col" data-slot="app-content" [attr.inert]="loading.busy() ? '' : null">
  <!-- The latest announcement, above the header; without one the header is the top line (admin-notify-bar). -->
  @if (announcements.barText(); as text) {
    <app-announcement-bar [text]="text" />
  }
  <header class="relative flex h-14 items-center gap-2 border-b px-4">
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="md:hidden"
      type="button"
      aria-label="Open menu"
      (click)="menuOpen.set(true)"
    >
      <ng-icon name="lucideMenu" appIconTone="brand" />
    </button>
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="hidden md:inline-flex"
      type="button"
      aria-controls="sidebar"
      [attr.aria-label]="sidebarLabel()"
      [attr.aria-expanded]="sidebarOpen()"
      (click)="toggleSidebar()"
    >
      <ng-icon name="lucideMenu" appIconTone="brand" aria-hidden="true" />
    </button>
    <!-- The main title: the logged-in company (the fixed name only without a session). -->
    <a routerLink="/" class="text-xl font-bold text-header-company" title="Go to the Dashboard">{{ title() }}</a>
    @if (auth.details(); as details) {
      <!-- The session: user, branch and financial year. Shortened on narrow screens; the full text is in the title
           and read by screen readers. -->
      <!-- The user, branch and year as colored chips: a soft tint, a matching icon and strong text of the same hue. -->
      <div data-slot="session-details" class="ml-auto flex min-w-0 items-center gap-2 text-sm" [title]="detailsText()">
        <span data-slot="session-chip" class="inline-flex min-w-0 items-center gap-1.5 rounded-full bg-header-user-bg px-2.5 py-0.5 font-semibold text-header-user ring-1 ring-current/25" aria-hidden="true">
          <!-- <ng-icon name="lucideUser" class="shrink-0" /> -->
          <span class="truncate">{{ details.user }}</span>
        </span>
        <span data-slot="session-chip" class="hidden min-w-0 items-center gap-1.5 rounded-full bg-header-branch-bg px-2.5 py-0.5 font-semibold text-header-branch ring-1 ring-current/25 sm:inline-flex" aria-hidden="true">
          <!-- <ng-icon name="lucideBuilding2" class="shrink-0" /> -->
          <span class="truncate">{{ details.branch }}</span>
        </span>
        <span data-slot="session-chip" class="hidden shrink-0 items-center gap-1.5 rounded-full bg-header-year-bg px-2.5 py-0.5 font-semibold text-header-year ring-1 ring-current/25 sm:inline-flex" aria-hidden="true">
          <!-- <ng-icon name="lucideCalendarDays" class="shrink-0" /> -->
          {{ details.year }}
        </span>
        <span class="sr-only">Logged in as {{ detailsText() }}</span>
      </div>
      <button
        hlmBtn
        variant="ghost"
        size="icon"
        class="shrink-0"
        type="button"
        aria-label="Change branch"
        title="Change branch"
        (click)="changeBranch()"
      >
        <ng-icon name="lucideArrowLeftRight" aria-hidden="true" />
      </button>
    }
    <button
      hlmBtn
      variant="ghost"
      size="icon"
      class="shrink-0"
      [class.ml-auto]="!auth.details()"
      type="button"
      [attr.aria-label]="themeLabel()"
      (click)="toggleTheme()"
    >
      <ng-icon [name]="themeIcon()" aria-hidden="true" />
    </button>
    @if (auth.isLoggedIn()) {
      <button hlmBtn variant="ghost" size="icon" class="shrink-0" type="button" aria-label="Log out" title="Log out" (click)="logout()">
        <ng-icon name="lucideLogOut" aria-hidden="true" />
      </button>
    }
    <!-- Shown while the application waits for the backend; it overlays the header's bottom line. -->
    <app-loading-bar class="absolute inset-x-0 -bottom-px" [active]="loading.busy()" />
  </header>

  <div class="flex flex-1">
    <aside id="sidebar" class="w-56 flex-none border-r" [class]="sidebarOpen() ? 'hidden md:block' : 'hidden'">
      <app-nav />
    </aside>

    <main class="page w-full min-w-0 flex-1 p-6">
      <router-outlet />
    </main>
  </div>
</div>

<hlm-sheet side="left" [state]="menuOpen() ? 'open' : 'closed'" (stateChanged)="menuOpen.set($event === 'open')">
  <hlm-sheet-content *hlmSheetPortal="let ctx">
    <hlm-sheet-header>
      <h3 hlmSheetTitle>Menu</h3>
    </hlm-sheet-header>
    <app-nav (navigated)="menuOpen.set(false)" />
  </hlm-sheet-content>
</hlm-sheet>

<app-loading-overlay [active]="loading.busy()" />
