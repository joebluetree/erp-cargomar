<h1 appPageTitle class="mb-4">Dashboard</h1>

<p class="text-muted-foreground">Welcome to iErp. Use the menu to open a screen.</p>

@if (menu.modules().length > 0) {
  <h2 class="mb-2 mt-8 text-lg font-semibold">Quick links</h2>
  @for (module of menu.modules(); track module.id) {
    <h3 data-slot="quick-links-module" class="mb-2 mt-4 text-sm font-semibold uppercase tracking-wide text-muted-foreground">
      {{ module.name }}
    </h3>
    <ul class="quick-links flex flex-wrap gap-4">
      @for (entry of module.menus; track entry.id) {
        <li>
          <a hlmBtn variant="outline" [routerLink]="'/' + entry.route" [queryParams]="{ menuId: entry.code }">
            <ng-icon [name]="look(entry.route).icon" [appIconTone]="look(entry.route).tone" aria-hidden="true" />
            {{ entry.name }}
          </a>
        </li>
      }
    </ul>
  }
}
