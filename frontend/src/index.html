<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cargomar Portal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Apply the saved (else system) theme before the app starts, to avoid a flash.
    // Keep this rule in sync with ThemeService.
    (function () {
      var dark;
      try {
        var stored = localStorage.getItem('ierp-theme');
        if (stored === 'dark' || stored === 'light') {
          dark = stored === 'dark';
        }
      } catch (e) {}
      if (dark === undefined) {
        dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      var root = document.documentElement;
      if (dark) {
        root.classList.add('dark');
      }
      root.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
